ue?<span class=\"ko\" style=\"display:block;color:var(--muted);font-size:14px;margin-top:2px\">대장균의 rRNA와 tRNA 합성에 관한 다음 설명 중 옳은 것은?<\/span>", "o": [["A", "Both rRNA and some tRNAs are part of the same primary transcript.<span class=\"ko\">rRNA와 일부 tRNA는 같은 1차 전사체의 일부이다.<\/span>", 1, "대장균 30S 전구-rRNA = 16S + tRNA(스페이서) + 23S + 5S (+3' 쪽 tRNA). rRNA 오페론은 7개 사본."], ["B", "Each rRNA sequence (16S, 23S, 5S) is transcribed into a separate primary transcript.<span class=\"ko\">각 rRNA 서열(16S, 23S, 5S)은 별도의 1차 전사체로 전사된다.<\/span>", 0, ""], ["C", "Primary tRNA transcripts undergo methylation, but rRNA sequences are not methylated.<span class=\"ko\">1차 tRNA 전사체는 메틸화되지만, rRNA 서열은 메틸화되지 않는다.<\/span>", 0, ""], ["D", "The tRNA sequences all lie at the 3’end of the rRNA transcripts<span class=\"ko\">tRNA 서열은 모두 rRNA 전사체의 3' 말단에 놓인다.<\/span>", 0, ""], ["E", "There is a single copy of the rRNA genes.<span class=\"ko\">rRNA 유전자는 단일 사본만 있다.<\/span>", 0, ""]]}, "26-19": {"q": "Which of the following is not usually essential for the catalytic activity of ribozymes?<span class=\"ko\" style=\"display:block;color:var(--muted);font-size:14px;margin-top:2px\">리보자임(ribozyme)의 촉매 활성에 일반적으로 필수적이지 않은 것은?<\/span>", "o": [["A", "Correct base pairing<span class=\"ko\">올바른 염기쌍 형성<\/span>", 0, ""], ["B", "Correct base sequence<span class=\"ko\">올바른 염기 서열<\/span>", 0, ""], ["C", "Correct interaction with protein<span class=\"ko\">단백질과의 올바른 상호작용<\/span>", 1, "리보자임은 RNA 자체가 촉매 — 단백질 없이도 활성(제I군 인트론 등). 서열과 접힘 구조가 핵심."], ["D", "Correct secondary structure<span class=\"ko\">올바른 2차 구조<\/span>", 0, ""], ["E", "Correct three-dimensional structure<span class=\"ko\">올바른 3차원 구조<\/span>", 0, ""]]}, "26-25": {"q": "AZT (3'-azido-2',3'-dideoxythymidine), used to treat HIV infection, acts in HIV-infected cells by:<span class=\"ko\" style=\"display:block;color:var(--muted);font-size:14px;margin-top:2px\">HIV 감염 치료에 사용되는 AZT(3'-아지도-2',3'-디데옥시티미딘)는 HIV에 감염된 세포에서 다음에 의해 작용한다:<\/span>", "o": [["A", "blocking ATP productio gulatory proteins, such as the lac repressor, is:<span class=\"ko\" style=\"display:block;color:var(--muted);font-size:14px;margin-top:2px\">lac 억제자 같은 많은 원핵생물 조절 단백질의 DNA 결합 모티프는:<\/span>", "o": [["A", "helix-turn-helix.<span class=\"ko\">나선-회전-나선(helix-turn-helix)<\/span>", 1, "원핵 조절 단백질의 대표 DNA 결합 모티프 = 나선-회전-나선(인식 나선이 큰 홈에 삽입)."], ["B", "homeobox.<span class=\"ko\">호메오박스(homeobox)<\/span>", 0, ""], ["C", "homeodomain.<span class=\"ko\">호메오도메인(homeodomain)<\/span>", 0, ""], ["D", "leucine zipper.<span class=\"ko\">류신 지퍼(leucine zipper)<\/span>", 0, ""], ["E", "zinc finger.<span class=\"ko\">아연 손가락(zinc finger)<\/span>", 0, ""]]}};

function cardHTML(q,ctx){
  const st=S.star.includes(q.id), res=S.res[q.id], sel=S.sel[q.id]||[];
  const shown = res!==undefined;
  let h=`<div class="qh"><div class="chips">`;
  h+=q.ys.map(y=>`<span class="yr">${yl(y)}${y==='2025'&&q.n?' · '+q.n+'번':''}</span>`).join('');
  h+=`<span class="ch">${q.ch}장</span><span class="kd">${KIND[q.k]}</span>`;
  if(q.tbq) h+=`<span class="tb">TB ${q.tbq}</span>`;
  if(q.t&&TY[q.t]) h+=`<button type="button" class="tchip" data-go="${q.t}">반복 · ${esc(TY[q.t].t)}</button>`;
  h+=`</div><button type="button" class="starbtn" data-star aria-pressed="${st}" aria-label="별표${st?' 해제':''}">${st?STAR_ON:STAR_OFF}</button></div>`;
  h+=`<p class="qt">${q.q}</p>`;
  if(q.img) h+=`<div class="fig"><img src="img/fac/${q.img}.jpg" alt="${q.n?q.n+'번 ':''}문제 그림" loading="lazy"></div>`;
  if(q.k==='w'){
    h+=`<textarea id="t-${q.id}-${ctx}" aria-label="답안 쓰기" data-txt placeholder="직접 써 본 뒤 모범답안을 열어 보세요.">${esc(S.txt[q.id]||'')}</textarea>`;
    h+=`<div class="acts"><button type="button" class="btn" data-model>${shown?'모범답안 접기':'모범답안 보기'}</button></div>`;
    if(shown) h+=`<div class="box model"><span class="lab">모범답안</span>${q.a}</div>`+(q.b?`<div class="box basic"><span class="lab">해설</span>${q.b}</div>`:'');
  } else {
    const g=graded(q);
    h+=`<div class="opts${shown?' done':''}">`+q.o.map((o,i)=>{
      let cls='', mk='';
      if(shown){
        if(o[2]===null){cls='na';mk='채점 제외';}
        else if(o[2]===1){cls='ok';mk=sel.includes(i)?'정답 ✓':'정답';}
        else if(sel.includes(i)){cls='ng';mk='오답';}
      } else if(sel.includes(i)) cls='sel';
      const ex = shown&&o[3]?`<span class="ex">${o[3]}</span>`:'';
      return `<button type="button" class="opt ${cls}" data-i="${i}" aria-pressed="${sel.includes(i)}"${shown?' tabindex="-1"':''}><span class="lb">${esc(o[0])}</span><span class="tx">${o[1]}${ex}</span>${mk?`<span class="mk">${mk}</span>`:''}</button>`;
    }).join('')+`</div>`;
    h+=`<div class="acts">`+(shown?`<button type="button" class="btn ghost" data-reset>다시 풀기</button>`:(g?`<button type="button" class="btn" data-grade>채점</button>`:`<button type="button" class="btn" data-grade>해설 보기</button>`))+`</div>`;
    if(shown&&g) h+=`<div class="verdict ${res?'good':'bad'}">${res?'맞았어요':'틀렸어요 — 초록 보기가 정답'}</div>`;
    if(shown&&q.b) h+=`<div class="box basic"><span class="lab">해설</span>${q.b}</div>`;
  }
  if(q.memo) h+=`<p class="memo">${q.memo}</p>`;
  const L=[];
  if(q.sl&&TRANS[q.ch]) L.push(`<a href="${TRANS[q.ch]}#s${q.sl}">${q.ch}장 번역본 슬라이드 ${q.sl}</a>`);
  if(q.tbq||q.tbr) L.push(`<a href="${TBURL}" target="_blank" rel="noopener">테스트뱅크 사이트 ${q.tbq||q.tbr}</a>`);
  if(L.length) h+=`<div class="links">${L.join('')}</div>`;
  return `<article class="q${st?' starred':''}" data-id="${q.id}" data-ctx="${ctx}" id="q-${q.id}-${ctx}">${h}</article>`;
}

const sortCh=(a,b)=>(a.ch-b.ch)||((a.sl||0)-(b.sl||0));
function pool(){
  if(view==='year'){
    const L=Q.filter(q=>q.ys.includes(sub));
    if(sub==='2025') L.sort((a,b)=>(+a.n||0)-(+b.n||0)); else L.sort(sortCh);
    return L;
  }
  if(view==='ch') return Q.filter(q=>q.ch===sub).sort((a,b)=>((a.sl||99)-(b.sl||99))||(YEARS.indexOf(a.ys[0])-YEARS.indexOf(b.ys[0])));
  if(view==='star') return Q.filter(q=>S.star.includes(q.id)).sort(sortCh);
  if(view==='wrong') return Q.filter(q=>S.res[q.id]===0&&graded(q)).sort(sortCh);
  return [];
}
function introHTML(){
  if(view==='year'&&sub==='2025') return `<div class="intro"><h2>2025 2학기 기말 (2025.12.18)</h2><ul><li>총 35문항 · 범위 23·25·26·27·28장 · 객관식은 대부분 기출에서 출제</li><li>"모두 고르시오"는 개수 표시 없음(답이 하나일 수도) · 단답형은 <b>영어로</b>, PPT 그림 빈칸이 많았음</li><li>복기 안 된 번호: ${MISSING25.join('·')}번</li><li>복기본에 정답이 표시돼 있지 않아 정답·해설은 슬라이드·교재 기준으로 달았고, 해석이 갈리는 보기는 <b>채점 제외</b>로 표시했어요.</li></ul></div>`;
  if(view==='year') return `<div class="intro"><h2>${yl(sub)} ${sub==='2017Q'?'':'기말'} 복기</h2><ul><li>예전 복기는 문항 번호가 남아 있지 않아 장·슬라이드 순서로 놓았어요.</li><li>같은 문제가 여러 해 나온 경우 한 카드에 연도를 모두 달았어요(풀이 기록도 하나로 이어져요).</li>${sub==='2016'?'<li>2016은 반별 복기(1·2차 기말, 퀴즈)를 합쳤어요.</li>':''}${sub==='2017'?'<li>2017 기말 범위는 27·28장.</li>':''}${sub==='2015'?'<li>2015 기말 2차(27·28장) — 복기본 정답 표시를 반영했어요.</li>':''}${sub==='2021'?'<li>2021은 테스트뱅크(영문)에서 그대로 나온 문제가 많아요.</li>':''}</ul></div>`;
  if(view==='ch'&&['26','27','28'].includes(sub)) return `<div class="intro"><h2>${CHS[sub]}</h2><ul><li>2015~2025 기출을 모두 넣었어요. 26~28장은 아직 번역본 페이지가 없어 슬라이드 링크는 없어요.</li><li>이 장의 테스트뱅크 전 문항은 <a href="${TBURL}" target="_blank" rel="noopener">테스트뱅크 사이트</a>에서 풀 수 있어요.</li></ul></div>`;
  if(view==='types') return `<div class="intro"><h2>반복 유형 ${TYPES.length}개</h2><ul><li>두 해 이상 나온 주제만 모았어요. 많이 나온 순서예요.</li><li>"해마다 바뀐 보기" 표에서 같은 문제를 보기만 바꿔 낸 패턴을 확인하고, 펼쳐서 바로 풀어요.</li></ul></div>`;
  if(view==='star') return S.star.length?'':'';
  return '';
}
function typesHTML(){
  const T=[...TYPES].sort((a,b)=>(b.yrs.length-a.yrs.length)||(+a.ch-+b.ch));
  return T.map(t=>`<section class="type" id="ty-${t.id}"><h3>${esc(t.t)}<span class="cnt">${t.yrs.length}번 출제</span><span class="ch" style="font-size:12px">${t.ch}장</span></h3>
  <p class="core">${t.core}</p><div class="tblw"><table>${t.diff.map(d=>`<tr><td>${yl(d[0])}</td><td>${d[1]}</td></tr>`).join('')}</table></div>
  <details${S.open[t.id]?' open':''} data-ty="${t.id}"><summary>이 유형 문제 ${t.qs.length}개 풀기</summary>${S.open[t.id]?t.qs.map(q=>cardHTML(q,'t')).join(''):''}</details></section>`).join('');
}
function render(keep){
  const y=scrollY;
  const V=[['year','연도별'],['ch','장별'],['types','반복 유형'],['star','★ 별표'],['wrong','틀린 문제']];
  const cnt={star:S.star.length,wrong:Q.filter(q=>S.res[q.id]===0&&graded(q)).length,types:TYPES.length};
  $('#views').innerHTML=V.map(([k,l])=>`<button type="button" class="tab" data-view="${k}" aria-pressed="${view===k}">${l}${cnt[k]!==undefined?`<span class="n">${cnt[k]}</span>`:''}</button>`).join('');
  let subs='';
  if(view==='year') subs=YEARS.map(Y=>`<button type="button" class="tab" data-sub="${Y}" aria-pressed="${sub===Y}">${yl(Y)}<span class="n">${Q.filter(q=>q.ys.includes(Y)).length}</span></button>`).join('');
  if(view==='ch') subs=Object.keys(CHS).map(c=>`<button type="button" class="tab" data-sub="${c}" aria-pressed="${sub===c}">${CHS[c]}<span class="n">${Q.filter(q=>q.ch===c).length}</span></button>`).join('');
  $('#subs').innerHTML=subs; $('#subs').hidden=!subs;
  const L=pool();
  let body=introHTML();
  if(view==='types') body+=typesHTML();
  else if(!L.length) body+=`<div class="empty">${view==='star'?'아직 별표한 문제가 없어요. 문제 오른쪽 위 ☆를 눌러 모아 두세요.':view==='wrong'?'틀린 문제가 없어요. 채점에서 틀린 문제가 여기에 모여요.':'문제가 없어요.'}</div>`;
  else {
    let cur='';
    for(const q of L){
      const g = view==='year'&&sub!=='2025'||view==='star'||view==='wrong' ? CHS[q.ch] : '';
      if(g&&g!==cur){cur=g; body+=`<div class="grp"><b>${g}</b></div>`;}
      body+=cardHTML(q,'l');
    }
  }
  $('#list').innerHTML=body;
  // 점수
  const scope = view==='types'?Q:L;
  const gs=scope.filter(graded), done=gs.filter(q=>S.res[q.id]!==undefined), right=done.filter(q=>S.res[q.id]===1);
  $('#score').innerHTML=view==='types'?`<span>전체 채점 <b>${done.length}</b>/${gs.length} · 맞음 <b>${right.length}</b></span>`:`<span>이 목록 채점 <b>${done.length}</b>/${gs.length} · 맞음 <b>${right.length}</b></span>`+(done.length?`<button type="button" data-clear>이 목록 기록 지우기</button>`:'')+`<span>${synced?'기록: 계정에 저장(다른 기기에서도 이어짐)':'기록: 이 브라우저에 저장'}</span>`;
  const nW=Q.filter(q=>q.k==='w').length, nM=Q.length-nW;
  $('#stats').innerHTML=`<span>문제 ${Q.length}개</span><span>객관식 ${nM} · 단답·서술 ${nW}</span><span>반복 유형 ${TYPES.length}개</span><span>2015–2025</span>`;
  if(keep) scrollTo(0,y);
}
function rerender(card){
  const q=BYID[card.dataset.id], ctx=card.dataset.ctx;
  const tmp=document.createElement('div'); tmp.innerHTML=cardHTML(q,ctx);
  card.replaceWith(tmp.firstElementChild);
  // 같은 문제가 다른 곳에 보이면 같이 갱신
  $$(`article.q[data-id="${q.id}"]`).forEach(c=>{ if(c.dataset.ctx!==ctx){const t=document.createElement('div'); t.innerHTML=cardHTML(q,c.dataset.ctx); c.replaceWith(t.firstElementChild);} });
}
function updateCounts(){ const y=scrollY; const v=$('#views'); const keep=document.activeElement; render(true); scrollTo(0,y); }

document.addEventListener('click',e=>{
  const vb=e.target.closest('[data-view]');
  if(vb){ view=vb.dataset.view; if(view==='year'&&!YEARS.includes(sub)) sub='2025'; if(view==='ch'&&!CHS[sub]) sub='23'; saveUI(); render(); scrollTo(0,$('.bar').offsetTop); return; }
  const sb=e.target.closest('[data-sub]');
  if(sb){ sub=sb.dataset.sub; saveUI(); render(); scrollTo(0,$('.bar').offsetTop); return; }
  if(e.target.closest('[data-clear]')){ pool().forEach(q=>{delete S.res[q.id]; delete S.sel[q.id];}); save(); render(true); return; }
  const go=e.target.closest('[data-go]');
  if(go){ const id=go.dataset.go; view='types'; S.open[id]=1; save(); saveUI(); render(); const el=$('#ty-'+id); if(el){el.scrollIntoView(); el.classList.add('flash');} return; }
  const card=e.target.closest('article.q'); if(!card) return;
  const q=BYID[card.dataset.id];
  if(e.target.closest('[data-star]')){ S.star=S.star.includes(q.id)?S.star.filter(x=>x!==q.id):[...S.star,q.id]; save(); if(view==='star'){render(true);} else {rerender(card); refreshTabs();} return; }
  if(q.k==='w'){
    if(e.target.closest('[data-model]')){ if(S.res[q.id]!==undefined) delete S.res[q.id]; else S.res[q.id]=1; save(); rerender(card); }
    return;
  }
  const ob=e.target.closest('.opt');
  if(ob&&S.res[q.id]===undefined){ const i=+ob.dataset.i; let s=(S.sel[q.id]||[]).slice();
    if(q.k==='s') s=s.includes(i)?[]:[i]; else s=s.includes(i)?s.filter(x=>x!==i):[...s,i];
    S.sel[q.id]=s; save(); rerender(card); const nc=$(`#q-${q.id}-${card.dataset.ctx} .opt[data-i="${i}"]`); if(nc) nc.focus(); return; }
  if(e.target.closest('[data-grade]')){
    const s=S.sel[q.id]||[]; const want=q.o.map((o,i)=>o[2]===1?i:-1).filter(i=>i>=0);
    const sc=s.filter(i=>q.o[i][2]!==null);
    S.res[q.id]= graded(q) ? ((want.length===sc.length&&want.every(i=>sc.includes(i)))?1:0) : 2;
    save(); rerender(card); refreshTabs(); return; }
  if(e.target.closest('[data-reset]')){ delete S.sel[q.id]; delete S.res[q.id]; save(); rerender(card); refreshTabs(); }
});
document.addEventListener('toggle',e=>{
  const d=e.target; if(!d.matches||!d.matches('details[data-ty]')) return;
  const id=d.dataset.ty; if(d.open){ S.open[id]=1; if(!d.querySelector('article')) d.insertAdjacentHTML('beforeend',TY[id].qs.map(q=>cardHTML(q,'t')).join('')); } else delete S.open[id];
  save();
},true);
let tt; document.addEventListener('input',e=>{ const t=e.target.closest('[data-txt]'); if(!t) return; const id=t.closest('article').dataset.id; S.txt[id]=t.value; clearTimeout(tt); tt=setTimeout(save,500); });
function refreshTabs(){
  const cnt={star:S.star.length,wrong:Q.filter(q=>S.res[q.id]===0&&graded(q)).length};
  $$('#views .tab').forEach(b=>{const k=b.dataset.view; if(cnt[k]!==undefined) b.querySelector('.n').textContent=cnt[k];});
  const scope=view==='types'?Q:pool(); const gs=scope.filter(graded), done=gs.filter(q=>S.res[q.id]!==undefined), right=done.filter(q=>S.res[q.id]===1);
  const sp=$('#score span b'); if(sp){ const bs=$$('#score b'); bs[0].textContent=done.length; if(bs[1]) bs[1].textContent=right.length; }
}
render();
</script>
